    var key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(box.salt), iterations: box.it, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(box.iv)}, key, bytes(box.data));
    var html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return html;
  }
  async function open(pw, remember, auto){
    pw = String(pw || "").trim();
    go.disabled = true; msg.textContent = "開いています…";
    try {
      var html = await unlock(pw);
      if (remember) store(false, pw);
      document.open(); document.write(html); document.close();
    } catch (e) {
      go.disabled = false;
      if (e && e.message === "old") msg.textContent = "このブラウザは古くて開けません。OS とブラウザを新しくしてください。";
      else {
        msg.textContent = auto ? "合い言葉が変わったようです。新しい合い言葉を入れてください。" : "合い言葉が違います。";
        store(false, null);
      }
    }
  }
  window.unlockForTest = open;
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault(); open(document.getElementById("pw").value, document.getElementById("keep").checked);
  });
  var saved = store(true);
  if (saved) open(saved, true, true);
})();
</script>

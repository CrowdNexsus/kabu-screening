<script>
(function(){
  var KEY = "memo-pw";
  var box = JSON.parse(document.getElementById("box").textContent);
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  function bytes(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function store(get, v){ try { if (get) return localStorage.getItem(KEY); if (v === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, v); } catch (e) {} return null; }
  async function unlock(pw){
    if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined")
      throw new Error("old");
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(box.salt), iterations: box.it, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(box.iv)}, key, bytes(box.data));
    var html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return html;
  }
  async function open(pw, remember, auto){
    pw = String(pw || "").trim();
    go.disabled = true; msg.textContent = "開いています…";
    try {
      var html = await unlock(pw);
      if (remember) store(false, pw);
      document.open(); document.write(html); document.close();
    } catch (e) {
      go.disabled = false;
      if (e && e.message === "old") msg.textContent = "このブラウザは古くて開けません。OS とブラウザを新しくしてください。";
      else {
        msg.textContent = auto ? "合い言葉が変わったようです。新しい合い言葉を入れてください。" : "合い言葉が違います。";
        store(false, null);
      }
    }
  }
  window.unlockForTest = open;
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault(); open(document.getElementById("pw").value, document.getElementById("keep").checked);
  });
  var saved = store(true);
  if (saved) open(saved, true, true);
})();
</script>
